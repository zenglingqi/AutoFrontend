
  title: "服务条款"
  subtitle: "网站使用及商品购买的条款与条件"
  intro:
    title: "简介"
    body: "本服务条款适用于您对本网站的使用以及在本网站购买商品。访问或使用本网站即表示您同意这些条款。请仔细阅读。"
  scope:
    title: "适用范围"
    body: "本条款适用于所有访问或使用本服务的访客、用户及其他人员，适用于本网站销售的日用品购买行为。"
  account:
    title: "账户与资格"
    body: "创建账户并下单需年满18周岁。您需对账户凭证保密，并对账户下的所有活动负责。"
  orders:
    title: "订单与接受"
    body: "提交订单即构成购买要约。我们保留因商品库存、价格或描述错误、疑似欺诈等原因拒绝接受订单的权利。"
  pricing:
    title: "价格与税费"
    body: "价格以所示货币显示，并在必要时包含适用税费。我们保留随时更改价格的权利，但已被接受的订单不受影响。"
  payment:
    title: "支付"
    body: "我们接受结账页面显示的支付方式。支付需获得授权并完成后，我们才会处理并发货。"
  shipping:
    title: "配送与交付"
    body: "配送时间和费用将在结账时显示。交付日期为估计值，可能受承运人延误、海关或其他不可控因素影响。"
  returns:
    title: "退货与退款"
    body: "我们的退货政策详见退货页面。通常在规定期限内接受未使用且保持原状的退货。收到并检验退回商品后将处理退款。"
  product_info:
    title: "商品信息"
    body: "我们尽力提供准确的商品描述和图片，但颜色和尺寸可能略有差异。如收到有缺陷或错误的商品，请联系客户支持。"
  intellectual_property:
    title: "知识产权"
    body: "网站上的所有内容（包括文本、图片、标识和设计）均为我们所有或经授权使用，受知识产权法保护。未经许可不得复制或使用。"
  limitation:
    title: "责任限制"
    body: "在法律允许的最大范围内，对于因使用本网站或购买商品而产生的间接、附带、特殊或后果性损害，我们不承担责任。"
  termination:
    title: "终止"
    body: "如违反本条款或基于其他原因，我们可暂停或终止您对网站或账户的访问。"
  governing_law:
    title: "适用法律"
    body: "本条款受我们法律声明中指定的司法辖区法律管辖。除法律另有规定外，争议将在适用法院解决。"
  changes:
    title: "条款变更"
    body: "我们可能不时更新本条款。更新后的条款将在网站上发布并标注生效日期。继续使用网站即表示接受变更。"
  contact:
    title: "联系我们"
    body: "如对服务条款有疑问，请通过联系我们的支持团队。"
