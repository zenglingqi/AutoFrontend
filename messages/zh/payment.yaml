
  title: "支付安全说明"
  subtitle: "我们如何保护您的支付信息"
  intro:
    title: "概述"
    body: "我们非常重视支付安全。此页面说明我们用于保护支付数据的措施，以及您可以采取的安全建议。"
  how:
    title: "我们如何保护支付"
    encryption:
      title: "加密传输"
      body: "所有支付数据在传输过程中使用 TLS 加密，必要时在存储时也会加密。"
    tokenization:
      title: "令牌化"
      body: "我们使用令牌化技术，您的卡号不会以明文形式存储在我们的服务器上。"
    compliance:
      title: "合规标准"
      body: "我们与符合 PCI 标准的支付服务商合作(Paypal/Stripe)， 并遵循支付安全最佳实践。"
    monitoring:
      title: "风控监测"
      body: "我们持续监测交易以发现可疑行为，如发现异常会及时联系您。"
  tips:
    title: "支付安全建议"
    use_secure_network: "在进行支付时请使用安全的私人网络。"
    verify_url: "始终核对网站地址并查看地址栏的锁形图标。"
    strong_password: "为账户使用强且唯一的密码。"
    enable_2fa: "启用两步验证（2FA）以增强账户安全。"
  faq:
    title: "常见问题"
    q1: "你们会存储我的完整卡号吗？"
    a1: "不会。我们不会存储完整卡号。我们使用令牌化并依赖符合 PCI 的支付处理方。"
    q2: "如果我发现未经授权的扣款怎么办？"
    a2: "请立即联系客户支持，我们会协助调查并采取相应措施。"
  contact:
    title: "联系我们"
    body: "如对支付安全有疑问，请通过联系我们的支持团队。"
