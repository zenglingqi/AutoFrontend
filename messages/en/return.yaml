



return_policy: "退货政策"
commitment: "我们对您的承诺不仅仅只提供至交货完毕。我们提供更多公平、公正的服务，在整个销售商品过程种，确保你的购物是愉快的，我们会尽可能在售前和你沟通确认双方对产品达成一致认可，以期望在销售中会减少不必要的资源浪费，来保证双方利益，同时减少碳排放。但我们依旧不会拒绝您合法，正常的退货请求。这也是对您利益的保证。退货过程我们主要准许下面条款："

hassle_free_30_days_return:
  title: "无忧30天退货"
  description: "我们每一件售出的商品需经过确认，以保证满足顾客的要求，同时商品介绍我们都基于真实描述，我们对所售品充满信心，确保您对购买的商品完全满意。如果您对购买的商品不满意，可以在发货日期起30天内将商品退回，且商品需保持原始、未穿戴状态，我们将为您提供全额退款或换货服务——无需任何问题。"
  exclusions: "个性化珠宝、定制订单、刻字商品、重新调整尺码的商品、使用不当或未按照商品描述保养使用造成的损坏商品、特价商品和“最终销售”商品不适用于退货或换货。"


free_shipping: "如果您在30天内退货或换货，我们将为您提供免费的退货运单，并通过电子邮件发送给您。"

insured_and_secure: "我们的免费退货标签为您的商品提供保险保障。"

start_return:
  description: "要发起退货或调整，请执行以下任一操作："
  options:
    - chat: "在网站上打开你的个人主页，进入订单页面，找到相关完毕的订单页面。点击请求退货，您将被引导到您的订单页面以启动退货或调整。我们的服务人员收到您的请求后，将在再后台和你联系，通过电话或邮件，由于邮件服务商的原因，我们的回复邮件可能在垃圾邮箱，请联系后注意检查。"
    - account_login: "登录您的在线账户，进入“我的订单”部分以设置退货。后续我们会联系你，向您提供退回地址信息等必要操作。"
    - create_account: "退换货过程账户是必需登录之前下单的账户，如果你忘记了账户密码，请尝试用之前注册账户的电话、邮箱、Google或FaceBook账户注册登录，若有其它问题也可邮件联系我们。"
    - contact_customer_service: "您也可以通过电话或电子邮件与我们的客户服务部门联系，我们每天8:00am UTC+8 - 16:00pm UTC+8 EST为您提供帮助,联系时请注意时区，（电子邮件: support@maxuniverse.shop）。"
    - contac_des: "电话联系可能因地区时间差别，服务质量会受严重影响。不是紧急处理事项我们更建议您通过邮件联系我们，我们会在收到你的联系后尽快联系您，给您答复。"

check_return_status:
  description: "如果您希望查询退货状态，请访问我们的退货状态页面。"

complimentary_returns:
  description: "客户享受全年内免费3次的退换货的权力，但我们会拒绝连续两次对同一商品退换（基于服务质量、商品差异的考量、我们认为出现这种情况是其它非正常因素导致），我们抵制滥用权力。"